name: CI - Code Quality & Automated Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 mypy pytest pytest-cov

      - name: Code Linting (flake8)
        run: |
          flake8 agent_engine cli tests --max-line-length=130 --extend-ignore=E203,W503

      - name: Strict Type Checking (mypy)
        run: |
          mypy agent_engine cli

      - name: Execute Full Pytest Test Suite
        run: |
          pytest tests/ target_repo/test_app.py -v --cov=agent_engine --cov=cli --cov-report=term-missing

      - name: Verify CLI Help Command
        run: |
          python -m cli.main --help
