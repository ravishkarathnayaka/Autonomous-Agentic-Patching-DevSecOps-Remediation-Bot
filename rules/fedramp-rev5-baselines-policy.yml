# Federal Risk and Authorization Management Program (FedRAMP) Rev 5 Baseline Policy
# Enforces NIST SP 800-53 Rev 5 Moderate & High baselines for cloud service providers.

policy_name: fedramp-rev5-moderate-high
version: "5.0.0"
framework: "FedRAMP Rev 5 / NIST SP 800-53 Rev 5"
description: "Autonomous policy enforcing cloud security, container isolation, and continuous monitoring."

thresholds:
  min_severity: HIGH
  min_cvss_score: 7.0
  auto_remediate_critical: true
  auto_remediate_high: true
  remediation_slas_hours:
    critical: 24
    high: 48
    medium: 120

control_families:
  - family: "AC: Access Control"
    description: "Least privilege and enforcement of server-side authorization checks."
    cwes:
      - CWE-284   # Improper Access Control
      - CWE-602   # Client-Side Security Check
      - CWE-862   # Missing Authorization

  - family: "IA: Identification and Authentication"
    description: "Multi-factor authentication and cryptographically resilient authenticator management."
    cwes:
      - CWE-287   # Improper Authentication
      - CWE-384   # Session Fixation
      - CWE-798   # Hardcoded Credentials

  - family: "SC: System and Communications Protection"
    description: "Boundary protection, cryptography in transit (TLS 1.3), and constant-time secret comparison."
    cwes:
      - CWE-319   # Cleartext Transmission
      - CWE-327   # Broken Cryptography
      - CWE-208   # Timing Attack
