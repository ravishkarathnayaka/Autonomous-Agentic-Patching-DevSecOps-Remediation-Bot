# SOC 2 Type II Trust Services Criteria (CC6.1 & CC6.8) Remediation Policy
policy_name: soc2-type-ii-remediation
version: "1.0.0"
description: "Policy governing vulnerability mitigation across SOC 2 boundary components."

thresholds:
  min_severity: HIGH
  min_cvss_score: 7.0
  auto_remediate_critical: true

mandatory_rules:
  - CWE-78    # OS Command Injection (CC6.8)
  - CWE-22    # Path Traversal (CC6.1)
  - CWE-502   # Insecure Deserialization (CC6.8)
  - CWE-798   # Hardcoded Credentials (CC6.1)
  - CWE-1395  # Vulnerable Third-Party Components (CC6.8)

sandbox:
  enforce_strict_network_isolation: true
  seccomp_profile: "docker/seccomp-profile.json"
