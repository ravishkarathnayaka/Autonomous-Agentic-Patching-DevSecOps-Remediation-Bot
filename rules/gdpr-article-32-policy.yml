# EU General Data Protection Regulation (GDPR) Article 32 Policy
# Enforces autonomous remediation standards for technical and organizational measures securing personal data.

policy_name: gdpr-article-32-security-of-processing
version: "1.0.0"
framework: "Regulation (EU) 2016/679 (GDPR)"
description: "Mandatory DevSecOps controls and automated patch verification satisfying GDPR Article 32 requirements."

thresholds:
  min_severity: MEDIUM
  min_cvss_score: 5.5
  auto_remediate_critical: true
  auto_remediate_high: true
  remediation_slas_hours:
    critical: 24
    high: 48
    medium: 120

mandatory_security_rules:
  - rule: "Art-32(1)(a)"
    description: "Pseudonymization and strong encryption of personal data at rest and in transit."
    cwes:
      - CWE-319   # Cleartext Transmission of Sensitive Information
      - CWE-312   # Cleartext Storage of Sensitive Information
      - CWE-327   # Broken or Risky Cryptographic Algorithm
      - CWE-326   # Inadequate Encryption Strength

  - rule: "Art-32(1)(b)"
    description: "Ability to ensure ongoing confidentiality, integrity, availability and system resilience."
    cwes:
      - CWE-89    # SQL Injection
      - CWE-79    # Cross-site Scripting
      - CWE-78    # OS Command Injection
      - CWE-400   # Uncontrolled Resource Consumption
      - CWE-1333  # Regular Expression Denial of Service (ReDoS)

  - rule: "Art-32(1)(c)"
    description: "Protection against unauthorized disclosure of or access to personal data."
    cwes:
      - CWE-200   # Information Exposure
      - CWE-209   # Information Exposure Through an Error Message
      - CWE-942   # Overly Permissive Cross-Origin Resource Sharing (CORS)
      - CWE-862   # Missing Authorization
      - CWE-639   # Insecure Direct Object References (IDOR)

sandbox_verification:
  require_hermetic_isolation: true
  drop_all_capabilities: true
  read_only_root_filesystem: true
  allowed_sandbox_time_seconds: 180
  verify_no_data_exfiltration: true
