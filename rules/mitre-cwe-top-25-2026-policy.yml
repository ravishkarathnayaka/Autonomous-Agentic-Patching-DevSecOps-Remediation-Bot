# MITRE 2026 CWE Top 25 Most Dangerous Software Weaknesses Policy
# Automated remediation enforcement for the most prevalent and critical software flaws.

policy_name: mitre-cwe-top-25-2026
version: "2026.1"
framework: "MITRE Common Weakness Enumeration Top 25"
description: "Zero-tolerance remediation baseline for high-prevalence software vulnerabilities."

thresholds:
  min_severity: HIGH
  min_cvss_score: 7.0
  auto_remediate_critical: true
  auto_remediate_high: true
  remediation_slas_hours:
    critical: 12
    high: 24
    medium: 48

priority_cwes:
  - id: "CWE-787"
    name: "Out-of-bounds Write"
    tier: "Tier-1"
  - id: "CWE-79"
    name: "Improper Neutralization of Input (Cross-site Scripting)"
    tier: "Tier-1"
  - id: "CWE-89"
    name: "SQL Injection"
    tier: "Tier-1"
  - id: "CWE-416"
    name: "Use After Free"
    tier: "Tier-1"
  - id: "CWE-78"
    name: "OS Command Injection"
    tier: "Tier-1"
  - id: "CWE-20"
    name: "Improper Input Validation"
    tier: "Tier-1"
  - id: "CWE-22"
    name: "Path Traversal"
    tier: "Tier-1"
  - id: "CWE-352"
    name: "Cross-Site Request Forgery (CSRF)"
    tier: "Tier-2"
  - id: "CWE-502"
    name: "Deserialization of Untrusted Data"
    tier: "Tier-2"
  - id: "CWE-918"
    name: "Server-Side Request Forgery (SSRF)"
    tier: "Tier-2"
  - id: "CWE-117"
    name: "Improper Output Handling for Logs"
    tier: "Tier-2"
  - id: "CWE-90"
    name: "LDAP Injection"
    tier: "Tier-2"
