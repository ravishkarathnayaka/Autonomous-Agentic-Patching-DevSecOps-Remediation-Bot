[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-agentic-patching-bot"
version = "0.1.0"
description = "Autonomous multi-agent DevSecOps remediation bot"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ravishka Rathnayaka" }
]
dependencies = [
    "pydantic>=2.5.0",
    "docker>=7.0.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = ["target_repo/.*", "tests/fixtures/.*"]

[[tool.mypy.overrides]]
module = ["docker.*"]
ignore_missing_imports = true
